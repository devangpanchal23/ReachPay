name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reachpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reachpay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REACHPAY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
      OWNER_EMAIL: ci-owner@example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
        run: |
          npm run db:migrate:auth
          npm run db:migrate:pos
          npm run db:migrate:beneficiaries
          npm run db:migrate:financial-operations
          npm run db:migrate:service-catalog
          npm run db:migrate:transfer-controls

      - name: Verify database migrations are repeatable
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
        run: |
          npm run db:migrate:auth
          npm run db:migrate:pos
          npm run db:migrate:beneficiaries
          npm run db:migrate:financial-operations
          npm run db:migrate:service-catalog
          npm run db:migrate:transfer-controls

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://reachpay.example

      - name: Install Vercel CLI
        run: npm install --global vercel@64.3.1

      - name: Pull production Vercel settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy production build
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
