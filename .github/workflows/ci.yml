name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reachpay_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reachpay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REACHPAY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
      OWNER_EMAIL: ci-owner@example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
        run: |
          npm run db:migrate:auth
          npm run db:migrate:pos
          npm run db:migrate:beneficiaries
          npm run db:migrate:financial-operations
          npm run db:migrate:service-catalog
          npm run db:migrate:transfer-controls

      - name: Verify database migrations are repeatable
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reachpay_test
        run: |
          npm run db:migrate:auth
          npm run db:migrate:pos
          npm run db:migrate:beneficiaries
          npm run db:migrate:financial-operations
          npm run db:migrate:service-catalog
          npm run db:migrate:transfer-controls

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://reachpay.example
